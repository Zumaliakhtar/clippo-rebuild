# GitHub Actions: builds the portable Windows app on GitHub's free runner.
# You just download the ready zip from the Actions tab — no Python on your PC.
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: One-click build
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Zip portable folder
        run: Compress-Archive -Path dist/ClippoRebuild -DestinationPath ClippoRebuild-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClippoRebuild-Windows
          path: ClippoRebuild-Windows.zip
